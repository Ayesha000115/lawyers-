# Netlify Configuration for Veritas Law Group (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

# Client-side Single Page Application (SPA) catch-all route
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Recommended security and protection headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-term immutable caching for hashed production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
